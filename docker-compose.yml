services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: groundtruth-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: groundtruth-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=groundtruth
      - POSTGRES_PASSWORD=groundtruth_dev_secret
      - POSTGRES_DB=groundtruth
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MOCK_INGESTION=${MOCK_INGESTION:-true}
      - AERODATABOX_API_KEY=${AERODATABOX_API_KEY:-}
      - AERODATABOX_API_HOST=${AERODATABOX_API_HOST:-aerodatabox.p.rapidapi.com}
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID:-}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET:-}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
      - FAA_NAS_API_URL=${FAA_NAS_API_URL:-https://nasstatus.faa.gov/api/airport-status-information}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: groundtruth-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=groundtruth
      - POSTGRES_PASSWORD=groundtruth_dev_secret
      - POSTGRES_DB=groundtruth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundtruth -d groundtruth"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: groundtruth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
